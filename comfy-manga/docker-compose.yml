name: comfy-manga

# Small, self-contained setup: ComfyUI with one model (Anima Manga) + a one-page app.
# Ports: ComfyUI :8288 (localhost only), app :8289 (localhost + home LAN).
services:
  comfyui:
    build: ./comfyui
    image: local/comfyui-manga:cu130   # shared cu130 image + pinned Anima nodes (comfyui/Dockerfile)
    container_name: comfyui-manga
    ports:
      - "127.0.0.1:8288:8188"
    volumes:
      - ./models:/app/ComfyUI/models
      - ./output:/app/ComfyUI/output
      - ./input:/app/ComfyUI/input
      - manga_out:/app/ComfyUI/output/manga   # RAM-backed results, shared with the app
      - manga_in:/app/ComfyUI/input/studio     # RAM: pictures the studio hands to ComfyUI (img2img, masks, edits)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command: python main.py --listen 0.0.0.0 --port 8188 --disable-metadata --reserve-vram 0.5
    logging: {driver: none}
    restart: "no"

  app:
    build: ./chat
    image: local/comfymanga:latest
    container_name: manga-app
    user: "1000:1000"   # files written to ~/Documents/Personal/manga belong to the user
    ports:
      - "127.0.0.1:8289:8189"
      - "192.168.0.235:8289:8189"   # home LAN (phone); no auth, home Wi-Fi only
    environment:
      - COMFY_URL=http://comfyui-manga:8188
      - APP_DIR=/data/manga/app                          # everything the app makes: SQLite + pictures (on disk)
      - IMPORT_DIRS=/data/manga/ram-backup-2026-10-24    # copied (read only) into the gallery once
      - LLM_URL=http://host.docker.internal:11434        # local llama.cpp router, used only if a model is loaded
      - MANGA_B=0   # phase B (angle refs, trait list, best-of-2, review before save): off until tested
      - TZ=America/Denver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/Documents/Personal/manga:/data/manga   # mode 700
      - ${HOME}/.config/manga-gpu:/keys:ro   # key for the host helper manga-gpu (GPU switch + LLM relay), not in git
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]   # nvidia-smi for the GPU line only
    logging: {driver: local}
    depends_on:
      - comfyui
    restart: "no"

volumes:
  manga_out:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=4g,uid=1000,gid=1000,mode=0700"}
  manga_in:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=1g,uid=1000,gid=1000,mode=0700"}
